<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopEase – Multi-vendor marketplace</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* shown while the JavaScript bundle loads; React replaces it on mount */
      #boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #f8fafc; }
      #boot img { height: 40px; width: auto; animation: boot-pulse 1.6s ease-in-out infinite; }
      #boot .dots { display: flex; gap: 7px; }
      #boot .dots i { width: 8px; height: 8px; border-radius: 9999px; background: #4f46e5; animation: boot-dot 1.2s ease-in-out infinite both; }
      #boot .dots i:nth-child(2) { animation-delay: 0.16s; }
      #boot .dots i:nth-child(3) { animation-delay: 0.32s; }
      @keyframes boot-pulse { 0%, 100% { opacity: 0.55; transform: scale(0.97); } 50% { opacity: 1; transform: scale(1); } }
      @keyframes boot-dot { 0%, 80%, 100% { transform: scale(0.55); opacity: 0.35; } 40% { transform: scale(1); opacity: 1; } }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <noscript>ShopEase needs JavaScript to run. Please enable it in your browser.</noscript>
    <div id="root">
      <div id="boot" role="status" aria-label="Loading ShopEase">
        <img src="/logo.png" alt="ShopEase" />
        <div class="dots"><i></i><i></i><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
