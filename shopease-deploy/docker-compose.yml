# Production stack: PostgreSQL + Spring Boot API + web (Caddy: HTTPS, static site, /api proxy).
# Expects the three project folders side by side:
#   shopease/            (backend)
#   shopease-frontend/   (frontend)
#   shopease-deploy/     (this folder)
# Run from this folder:  docker compose up -d --build

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopease
      POSTGRES_USER: shopease
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopease -d shopease"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
    # not published to the host: only the api container can reach the database

  api:
    build:
      context: ../shopease
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/shopease
      DB_USERNAME: shopease
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 random characters)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:?Set PAYSTACK_SECRET_KEY in .env}
      PAYSTACK_CALLBACK_URL: https://${DOMAIN}/payment/callback
      FRONTEND_URL: https://${DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-ShopEase <onboarding@resend.dev>}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    logging: *logging
    # not published to the host: traffic arrives through the web container

  web:
    build:
      context: ..
      dockerfile: shopease-deploy/web.Dockerfile
      args:
        VITE_COMPANY_NAME: ${VITE_COMPANY_NAME:-ShopEase}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-support@your-domain.com}
        VITE_COMPANY_ADDRESS: ${VITE_COMPANY_ADDRESS:-}
        VITE_LEGAL_REVIEWED: ${VITE_LEGAL_REVIEWED:-false}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
